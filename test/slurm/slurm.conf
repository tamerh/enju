# Minimal single-node SLURM for the executor live test. No
# cgroups (task/none + proctrack/linuxproc) so it runs in a
# plain container without --privileged or host cgroup mounts.
# Accounting points at slurmdbd so `sacct` works — that's the
# whole reason this isn't just `slurmctld` alone.
ClusterName=enjutest
SlurmctldHost=localhost

SlurmUser=slurm
SlurmdUser=root
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
# Container CPU topology won't match the configured values;
# accept the configured node spec instead of refusing the node.
SlurmdParameters=config_overrides
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
ReturnToService=2

# Accounting via slurmdbd (gives us sacct).
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost
JobAcctGatherType=jobacct_gather/none

# One node, one partition. CPUs kept low; container-friendly.
NodeName=localhost CPUs=2 RealMemory=512 State=UNKNOWN
PartitionName=debug Nodes=localhost Default=YES MaxTime=INFINITE State=UP
