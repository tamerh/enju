# slurmdbd → mariadb. Must be 0600 owned by SlurmUser (the
# Dockerfile chowns/chmods it). Password is fixed because this
# image is a throwaway test sandbox, never networked.
DbdHost=localhost
DbdPort=6819
SlurmUser=slurm
AuthType=auth/munge
PidFile=/run/slurmdbd.pid
LogFile=/var/log/slurm/slurmdbd.log

StorageType=accounting_storage/mysql
StorageHost=localhost
StoragePort=3306
StorageUser=slurm
StoragePass=slurmpw
StorageLoc=slurm_acct_db
