# SLURM 23.11 (Ubuntu 24.04) ALWAYS initializes the cgroup
# plugin in slurmd, even with TaskPlugin=task/none +
# ProctrackType=proctrack/linuxproc — so we can't avoid it, we
# have to make cgroup/v2 work without a systemd/dbus scope
# manager (there's none in the container). IgnoreSystemd=yes
# makes the v2 plugin manage the cgroup tree directly via the
# cgroupfs instead of asking systemd over dbus. ("disabled" is
# NOT a valid CgroupPlugin in 23.11 — added in a later release.)
#
# Pairs with `docker run --privileged` in run.sh, which gives
# the container a writable cgroup2 hierarchy to manage.
CgroupPlugin=autodetect
IgnoreSystemd=yes
