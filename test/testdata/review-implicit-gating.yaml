name: "Implicit review gating"
version: 1
tasks:
  - id: draft
    action: answer
    prompt: "Write a summary."

  - id: check
    action: review
    reviews: draft
    prompt: "Read and verdict."

  # Note: publish has NO explicit depends_on [check].
  # The parser auto-injects it because publish references
  # {{draft.content}} and draft is reviewed by check.
  - id: publish
    action: answer
    prompt: "Publish the reviewed draft: {{draft.content}}"
