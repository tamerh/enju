# Worked example for the `aggregates:` fan-in primitive.
#
# Shape: 3 items → each gets analyzed independently → one
# singular synth task reduces over all 3 analyses to produce a
# single final output.
#
# Without `aggregates:`, this run-level for_each would multiply
# every task — including `synth` — producing 3 redundant
# synthesis tasks instead of 1. The `aggregates: analyze` line
# tells the planner to keep `synth` singular and wait for all
# 3 instances of `analyze` before becoming ready. Inside synth's
# prompt, `{{analyze.content}}` resolves to the joined content
# of every analyze instance with per-iteration headers.

name: Fan-in synthesis example

for_each:
  topic:
    - "remote work productivity"
    - "async communication patterns"
    - "cross-timezone team rituals"

tasks:
  - id: analyze
    action: answer
    prompt: |
      Write a one-paragraph analysis of the topic: "{{topic}}".

      Focus on tradeoffs and evidence quality. Don't conclude;
      just lay out what's known and what's contested.

  - id: synth
    action: answer
    aggregates: analyze
    prompt: |
      You're synthesizing across three independent analyses of
      adjacent workplace topics. Each was produced without
      seeing the others.

      Find the through-line: what's the common claim across
      these three? What's the strongest piece of evidence? What
      contradiction shows up?

      The three analyses follow.

      {{analyze.content}}
